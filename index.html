<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <title>🏠家宴点菜</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
    html { scroll-behavior: smooth; }
    body{background:#f7f8fa;padding-bottom:60px;}
    
    /* 顶部标题 */
    header{background:#2c3e50;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:600;position:sticky;top:0;z-index:100;}
    
    /* 主容器：左侧导航 + 右侧菜单 */
    .layout-wrapper {
      display: flex;
      max-width: 900px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* 左侧分类导航 */
    .category-nav {
      width: 90px;
      flex-shrink: 0;
      background: #fff;
      position: sticky;
      top: 57px; /* 贴紧 header 底部 */
      height: calc(100vh - 57px);
      overflow-y: auto;
      border-right: 1px solid #eee;
      display: flex;
      flex-direction: column;
      padding: 10px 4px;
      box-shadow: 2px 0 4px rgba(0,0,0,0.03);
    }

    .category-nav a {
      color: #555;
      text-decoration: none;
      padding: 10px 4px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: block;
    }
    
    .category-nav a:hover, .category-nav a:active {
      background: #27ae60;
      color: #fff;
    }

    /* 右侧容器与模块 */
    .container{flex:1;padding:12px;min-width:0;}
    .info-block{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px #00000012;}
    input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:16px;margin-top:8px;}
    textarea{min-height:70px;resize:none;}

    /* 分类标题 */
    .category-title {
      font-size: 16px;
      font-weight: 600;
      margin: 16px 0 10px 0;
      padding-left: 8px;
      border-left: 4px solid #27ae60;
      color: #2c3e50;
      scroll-margin-top: 7
