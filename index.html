<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <title>🏠家宴点菜</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
    body{background:#f7f8fa;padding-bottom:100px;}
    header{background:#2c3e50;color:#fff;padding:18px 16px;text-align:center;font-size:20px;font-weight:600;}
    .container{max-width:720px;margin:0 auto;padding:16px;}
    .info-block{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px #00000012;}
    input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:16px;margin-top:8px;}
    textarea{min-height:70px;resize:none;}
    .dish-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .dish-item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #00000012;}
    .dish-img{height:120px;background:#e8e8e8;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;object-fit:cover;width:100%;}
    .dish-body{padding:10px;}
    .dish-name{font-size:15px;font-weight:500;margin-bottom:6px;}
    .checkbox-wrap{display:flex;align-items:center;gap:6px;}
    .submit-btn{width:100%;background:#27ae60;color:#fff;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:600;margin-top:20px;cursor:pointer;}
    .tip{font-size:13px;color:#888;margin-top:6px;}
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:14px 22px;border-radius:8px;display:none;z-index:9999;}
  </style>
</head>
<body>

<!-- 隐藏iframe，用来提交谷歌表单，不跳转页面 -->
<iframe id="hidden_iframe" name="hidden_iframe" style="display:none;"></iframe>

<form id="mainForm" target="hidden_iframe" action="https://docs.google.com/forms/d/e/1FAIpQLSfXiYIxGED01pk1D49kdKUldVDgqhZi6MbXbvERzDDL1l6y7A/formResponse" method="POST">
  <!-- 已自动嵌入你的表单 entry 编号 -->
  <input type="hidden" name="entry.1080825637" id="field_name">
  <input type="hidden" name="entry.2121342424" id="field_note">
  <input type="hidden" name="entry.486359214" id="field_dishes">

<header>🏠家宴点菜</header>
<div class="container">
  <div class="info-block">
    <div>你的姓名</div>
    <input id="username" placeholder="请输入名字">
    <div style="margin-top:12px;">忌口 / 备注</div>
    <textarea id="remark" placeholder="不吃辣、过敏等"></textarea>
  </div>

  <div class="info-block">
    <div style="margin-bottom:10px;font-weight:500;">请选择菜品</div>
    <div class="dish-list" id="dishWrap">
      <div class="dish-item">
        <div class="dish-img">图片位</div>
        <div class="dish-body">
          <div class="dish-name">红烧肉</div>
          <div class="checkbox-wrap">
            <input type="checkbox" class="dish-check" data-name="红烧肉">
            <label>想要</label>
          </div>
        </div>
      </div>
      <div class="dish-item">
        <div class="dish-img">图片位</div>
        <div class="dish-body">
          <div class="dish-name">清蒸鱼</div>
          <div class="checkbox-wrap">
            <input type="checkbox" class="dish-check" data-name="清蒸鱼">
            <label>想要</label>
          </div>
        </div>
      </div>
      <div class="dish-item">
        <div class="dish-img">图片位</div>
        <div class="dish-body">
          <div class="dish-name">白灼虾</div>
          <div class="checkbox-wrap">
            <input type="checkbox" class="dish-check" data-name="白灼虾">
            <label>想要</label>
          </div>
        </div>
      </div>
      <div class="dish-item">
        <div class="dish-img">图片位</div>
        <div class="dish-body">
          <div class="dish-name">炒时蔬</div>
          <div class="checkbox-wrap">
            <input type="checkbox" class="dish-check" data-name="炒时蔬">
            <label>想要</label>
          </div>
        </div>
      </div>
    </div>
    <div class="tip">可以勾选多个菜品</div>
  </div>

  <button class="submit-btn" type="submit">✅提交点菜</button>
</div>
</form>

<div class="toast" id="toast">提交成功！</div>

<script>
const form = document.getElementById('mainForm');
const iframe = document.getElementById('hidden_iframe');
const toast = document.getElementById('toast');

form.addEventListener('submit', function(e){
  // 收集勾选菜品
  const checks = document.querySelectorAll('.dish-check:checked');
  const selected = Array.from(checks).map(cb=>cb.dataset.name).join('、');

  document.getElementById('field_name').value = document.getElementById('username').value;
  document.getElementById('field_note').value = document.getElementById('remark').value;
  document.getElementById('field_dishes').value = selected;
});

iframe.onload = function(){
  // iframe加载完成 = 提交完毕
  toast.style.display='block';
  setTimeout(()=>{
    toast.style.display='none';
    form.reset();
  },1800);
}
</script>

</body>
</html>
